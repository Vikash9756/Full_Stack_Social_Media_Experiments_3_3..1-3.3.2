```properties
spring.application.name=social-media-management
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/socialdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:socialuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:socialpass}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=social-post-workers
spring.kafka.consumer.auto-offset-reset=earliest

springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${JWT_SECRET:change-this-demo-secret-to-a-long-random-value-before-deploying-123456}

management.endpoints.web.exposure.include=health
```
